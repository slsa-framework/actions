---
name: SLSA Build Provenance Attester

description: >-
  Watches a GitHub Actions workflow run, waits for its jobs to complete and
  generates a signed SLSA build provenance attestation over the run's
  artifacts using slsa-attester.

branding:
  icon: 'shield'
  color: 'green'

inputs:
  run-spec:
    description: >-
      Run to attest as github://owner/repo/runID. When empty the current run
      is watched; the attester excludes its own job — which must be dedicated
      to attesting — and waits for every sibling job.
    required: false
    default: ""

  sign:
    description: "Sign the attestation with the job's workload identity (sigstore)"
    required: false
    default: "true"

  output:
    description: "Path to write the provenance attestation"
    required: false
    default: "provenance.intoto.json"

  watch-jobs:
    description: "Comma-separated list of job names to watch (default: every job)"
    required: false
    default: ""

  timeout:
    description: "Max time to wait for the watched jobs (Go duration; 0 disables)"
    required: false
    default: "20m"

  collect-artifacts:
    description: "Collect the run's GitHub Actions artifacts as subjects"
    required: false
    default: "true"

  expand-artifacts:
    description: >-
      Unpack artifact archives and attest one subject per contained file.
      When false, each artifact archive is attested as a single subject.
    required: false
    default: "true"

  artifacts-filter:
    description: "Comma-separated globs matched against artifact and release asset names; only matches are attested"
    required: false
    default: ""

  release:
    description: >-
      Also attest the assets of this release (tag) in the watched repository.
      Use it when the run publishes its artifacts to a GitHub release (eg via
      goreleaser) instead of the workflow artifact store.
    required: false
    default: ""

  sboms:
    description: >-
      Comma-separated collector sources to fetch SBOMs from (eg 'fs:sboms/'
      or 'release:owner/repo@v1.0.0'). The SBOMs' top-level elements are
      attested as subjects; they must carry hashes.
    required: false
    default: ""

  dependencies:
    description: >-
      Comma-separated extra resolved dependencies, each in slsa-attester
      resource descriptor shorthand (eg 'name=dep,uri=git+https://...,sha256=...')
    required: false
    default: ""

  subjects:
    description: "Comma-separated extra subjects as algorithm:digest, eg sha256:<hex>"
    required: false
    default: ""

  base64-subjects:
    description: >-
      Extra subjects as a base64-encoded checksums file in sha256sum format
      (digest and name per line) — the same input slsa-github-generator's
      generic generator accepted, eg "$(sha256sum artifact* | base64 -w0)".
    required: false
    default: ""

  build-from-source:
    description: >-
      Build slsa-attester from the tip of its repository instead of
      downloading and verifying a released binary. For development; the
      built binary is unpinned and unverified.
    required: false
    # TODO: flip to false once a stable slsa-attester release is out.
    default: "true"

  verify:
    description: >-
      Verify the downloaded slsa-attester release against the SLSA
      provenance published with it before running it. Only disable to
      use a release that published no provenance.
    required: false
    default: "true"

  unsafe-shared-job:
    description: >-
      Attest even when the job contains other steps. UNSAFE: steps that run
      earlier in the job can tamper with the runner (replace the attester,
      poison the tool cache) and forge the attestation, and every step in the
      job shares the OIDC identity the attestation is signed with. The
      attester refuses shared jobs by default; give it a job of its own
      instead.
    required: false
    default: "false"

  version:
    description: "slsa-attester release to download when not building from source"
    required: false
    default: "v0.1.0-rc.3"

outputs:
  attestation:
    description: "Path to the generated provenance attestation"
    value: ${{ steps.attest.outputs.attestation }}

runs:
  using: composite
  steps:
    # Download a released slsa-attester and the provenance published with
    # it. Inputs reach the script through the environment and are
    # validated before use.
    - id: download
      if: inputs.build-from-source != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERIFY: ${{ inputs.verify }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*" >&2; exit 1; }

        VERSION="${VERSION:-v0.1.0-rc.3}"
        case "${VERSION}" in
          v[0-9]*) ;;
          *) fail "version must be a release tag (vX.Y.Z), got: ${VERSION}" ;;
        esac

        case "${RUNNER_OS_NAME}" in
          Linux)   os="linux" ;;
          macOS)   os="darwin" ;;
          Windows) os="windows" ;;
          *) fail "unsupported OS: ${RUNNER_OS_NAME}" ;;
        esac
        case "${RUNNER_ARCH_NAME}" in
          X64)   arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) fail "unsupported architecture: ${RUNNER_ARCH_NAME}" ;;
        esac
        ext=""
        [ "${os}" = "windows" ] && ext=".exe"

        repo="slsa-framework/attester"
        work="${RUNNER_TEMP}/slsa-attester-release"
        mkdir -p "${work}"
        release_file="slsa-attester-${VERSION}-${os}-${arch}${ext}"
        binary="${work}/${release_file}"

        echo "Downloading ${release_file}"
        curl -sSfL --retry 3 --retry-all-errors --retry-delay 2           -o "${binary}"           "https://github.com/${repo}/releases/download/${VERSION}/${release_file}"           || fail "downloading ${release_file}"
        chmod 0755 "${binary}"

        attestations=""
        if [ "${VERIFY}" = "true" ]; then
          attestations="${work}/attestations.jsonl"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2             -o "${attestations}"             "https://github.com/${repo}/releases/download/${VERSION}/attestations.jsonl"             || fail "downloading the release provenance"
        else
          echo "::warning::Skipping provenance verification of ${release_file}"
        fi

        # The release provenance names the attester's release workflow as
        # the builder and is signed by the attest_actions reusable
        # workflow of this repository (the observer). Regexp
        # metacharacters are escaped and the spec anchored.
        # TODO: pin the observer to release tags once this repository
        # tags releases.
        builder_id="https://github.com/${repo}/.github/workflows/release.yaml"
        observer="https://github.com/slsa-framework/actions/.github/workflows/attest_actions.yml"
        escaped_observer="$(printf '%s' "${observer}" | sed 's/[.+]/\\&/g')"
        signer="sigstore(regexp)::https://token\.actions\.githubusercontent\.com::^${escaped_observer}@.*$"

        {
          echo "binary=${binary}"
          echo "attestations=${attestations}"
          echo "builder-id=${builder_id}"
          echo "signer=${signer}"
        } >> "${GITHUB_OUTPUT}"

    # The release is verified before it runs: the provenance published
    # with it must cover the binary, name the attester's release workflow
    # as the builder, and be signed by the attest_actions observer.
    - name: Verify the attester release
      if: inputs.build-from-source != 'true' && inputs.verify == 'true'
      uses: carabiner-dev/actions/ampel/verify@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9
      with:
        subject: ${{ steps.download.outputs.binary }}
        collector: jsonl:${{ steps.download.outputs.attestations }}
        policy: git+https://github.com/carabiner-dev/policies@b4734ea025ac3d42a4ca78bec759aa72cebdb4a2#slsa/builderid-base.json
        context: "builderId:${{ steps.download.outputs.builder-id }}"
        signer: ${{ steps.download.outputs.signer }}
        attest: "false"
        results: summary

    # Only a verified binary lands on the path the attest step executes.
    - id: install
      if: inputs.build-from-source != 'true'
      shell: bash
      env:
        BINARY: ${{ steps.download.outputs.binary }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        mkdir -p "${WORKSPACE}/.slsa-attester"
        cp "${BINARY}" "${WORKSPACE}/.slsa-attester/slsa-attester"
        "${WORKSPACE}/.slsa-attester/slsa-attester" --version

    - name: Check out slsa-attester
      if: inputs.build-from-source == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: slsa-framework/attester
        path: ${{ github.workspace }}/.slsa-attester/src
        persist-credentials: false

    - id: go_versions
      if: inputs.build-from-source == 'true'
      uses: carabiner-dev/actions/go/versions@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9
      with:
        go-mod-path: ${{ github.workspace }}/.slsa-attester/src/go.mod

    - if: inputs.build-from-source == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go_versions.outputs.GO_VERSION_STABLE }}
        cache-dependency-path: ${{ github.workspace }}/.slsa-attester/src/go.sum

    - id: build_binary
      if: inputs.build-from-source == 'true'
      name: Build slsa-attester
      shell: bash
      run: |
        cd "${WORKSPACE}/.slsa-attester/src"
        go build -o "${WORKSPACE}/.slsa-attester/slsa-attester" .
        "${WORKSPACE}/.slsa-attester/slsa-attester" --version
      env:
        WORKSPACE: ${{ github.workspace }}

    - id: attest
      name: Watch the run and attest
      shell: bash
      # All context values are passed through the environment and quoted in
      # the script to avoid shell injection.
      run: |
        set -euo pipefail

        ARGS=(watch)
        if [ -n "${RUN_SPEC}" ]; then
          ARGS+=("${RUN_SPEC}")
        fi
        ARGS+=(
          --sign="${SIGN}"
          --output="${OUTPUT}"
          --timeout="${TIMEOUT}"
          --collect-artifacts="${COLLECT_ARTIFACTS}"
          --expand-artifacts="${EXPAND_ARTIFACTS}"
        )
        if [ -n "${WATCH_JOBS}" ]; then
          ARGS+=(--watch-jobs="${WATCH_JOBS}")
        fi
        if [ "${UNSAFE_SHARED_JOB}" = "true" ]; then
          ARGS+=(--allow-shared-job)
        fi
        if [ -n "${RELEASE}" ]; then
          ARGS+=(--release="${RELEASE}")
        fi
        if [ -n "${SBOMS}" ]; then
          IFS=',' read -ra BOMS <<< "${SBOMS}"
          for bomsrc in "${BOMS[@]}"; do
            bomsrc="$(echo "${bomsrc}" | xargs)"
            if [ -n "${bomsrc}" ]; then
              ARGS+=(--sbom="${bomsrc}")
            fi
          done
        fi
        if [ -n "${ARTIFACTS_FILTER}" ]; then
          ARGS+=(--artifacts-filter="${ARTIFACTS_FILTER}")
        fi
        if [ -n "${DEPENDENCIES}" ]; then
          IFS=',' read -ra DEPS <<< "${DEPENDENCIES}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "${dep}" | xargs)"
            if [ -n "${dep}" ]; then
              ARGS+=(--dependency="${dep}")
            fi
          done
        fi
        if [ -n "${BASE64_SUBJECTS}" ]; then
          CHECKSUMS_FILE="${RUNNER_TEMP}/subjects.checksums"
          echo "${BASE64_SUBJECTS}" | base64 -d > "${CHECKSUMS_FILE}"
          ARGS+=(--checksums="${CHECKSUMS_FILE}")
        fi
        if [ -n "${SUBJECTS}" ]; then
          IFS=',' read -ra SUBS <<< "${SUBJECTS}"
          for sub in "${SUBS[@]}"; do
            sub="$(echo "${sub}" | xargs)"
            if [ -n "${sub}" ]; then
              ARGS+=(--subject="${sub}")
            fi
          done
        fi

        echo "::group::Running slsa-attester watch"
        "${WORKSPACE}/.slsa-attester/slsa-attester" "${ARGS[@]}"
        echo "::endgroup::"

        echo "attestation=${OUTPUT}" >> "${GITHUB_OUTPUT}"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WORKSPACE: ${{ github.workspace }}
        RUN_SPEC: ${{ inputs.run-spec }}
        SIGN: ${{ inputs.sign }}
        OUTPUT: ${{ inputs.output }}
        TIMEOUT: ${{ inputs.timeout }}
        COLLECT_ARTIFACTS: ${{ inputs.collect-artifacts }}
        EXPAND_ARTIFACTS: ${{ inputs.expand-artifacts }}
        WATCH_JOBS: ${{ inputs.watch-jobs }}
        UNSAFE_SHARED_JOB: ${{ inputs.unsafe-shared-job }}
        RELEASE: ${{ inputs.release }}
        SBOMS: ${{ inputs.sboms }}
        ARTIFACTS_FILTER: ${{ inputs.artifacts-filter }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        SUBJECTS: ${{ inputs.subjects }}
        BASE64_SUBJECTS: ${{ inputs.base64-subjects }}
